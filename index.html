<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Easy CV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="toolbar">
    <span class="brand">◆ Easy CV</span>
    <button class="btn" data-act="undo" id="btn-undo" title="撤销 (Ctrl+Z)">↩ 撤销</button>
    <button class="btn" data-act="redo" id="btn-redo" title="重做 (Ctrl+Y)">↪ 重做</button>
    <span class="sep"></span>
    <button class="btn" data-act="dd-theme" id="btn-theme" title="主题">主题 ▾</button>
    <button class="btn" data-act="dd-color" id="btn-color" title="配色">配色 ▾</button>
    <button class="btn" data-act="dd-settings" id="btn-settings" title="设置">⚙ 设置</button>
    <span class="spacer"></span>
    <span class="save-target" id="save-target" title="Ctrl+S 保存位置"></span>
    <button class="btn" data-act="import">导入</button>
    <button class="btn" data-act="export" id="btn-export">导出</button>
    <button class="btn primary" data-act="print" title="Ctrl+P">打印 / 导出 PDF</button>
  </header>

  <div class="app-body">
    <aside class="editor-pane">
      <div class="block-scroll">
        <p class="pane-title">Blocks</p>
        <div class="block-list" id="block-list"></div>
      </div>
      <button class="add-block-btn" data-act="add-block" title="添加块">+</button>
    </aside>

    <main class="preview-pane" id="preview-pane"></main>
  </div>
</div>

<!-- 弹层：主题 / 导出 / 添加块 / 块操作 / 设置 -->
<div class="menu" id="themeMenu" hidden>
  <div class="menu-item" data-act="theme" data-theme="classic">经典（衬线）</div>
  <div class="menu-item" data-act="theme" data-theme="modern">现代（无衬线）</div>
</div>
<div class="menu" id="colorMenu" hidden>
  <div class="color-swatches" id="color-swatches"></div>
  <div class="color-custom">
    <input type="text" id="accent-input" placeholder="#1a3a5c" spellcheck="false" autocomplete="off">
    <button class="btn small" id="accent-add" data-act="accent-add" title="把输入的颜色加为色块（编辑模式下为保存）">+ 添加</button>
  </div>
  <div class="menu-item" data-act="accent-random">🎲 随机配色</div>
  <div class="color-current"><span>当前色号</span><code id="accent-current">#1a3a5c</code></div>
</div>
<div class="menu" id="swatchMenu" hidden>
  <div class="menu-item" data-act="swatch-edit">✎ 修改颜色</div>
  <div class="menu-item danger" data-act="swatch-del">✕ 删除</div>
</div>
<div class="menu" id="addMenu" hidden></div>
<div class="menu" id="blockMenu" hidden>
  <div class="menu-item" data-act="menu-insert">+ 在此后插入</div>
  <div class="menu-item" data-act="menu-dup">⧉ 复制</div>
  <div class="menu-item danger" data-act="menu-del">✕ 删除</div>
</div>

<div class="modal-mask" id="settings-modal" hidden>
  <div class="modal">
    <h3>设置</h3>
    <div class="field">
      <label>日期格式</label>
      <select id="set-datefmt">
        <option value="MMM YYYY">2022-06 → Jun 2022</option>
        <option value="YYYY-MM">2022-06 → 2022-06</option>
      </select>
    </div>
    <div class="field">
      <label>语言 / 小节标题</label>
      <select id="set-lang">
        <option value="en">English（Education / Work Experience …）</option>
        <option value="zh">中文（教育经历 / 工作经历 …）</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn primary" data-act="save-settings">保存</button>
      <button class="btn" data-act="close-settings">取消</button>
    </div>
  </div>
</div>

<input type="file" id="import-file" accept=".json,application/json" hidden>
<div id="toast" hidden></div>

<!-- 模块化加载：普通 <script>（非 ES module）在 file:// 下可用 -->
<script src="js/utils.js"></script>
<script src="js/blocks.js"></script>
<script src="js/themes.js"></script>
<script src="js/store.js"></script>
<script src="js/render.js"></script>
<script src="js/editor.js"></script>
<script src="js/export.js"></script>
<script src="js/sample.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
